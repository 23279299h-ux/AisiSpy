name: Build AisiSpy IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools + SDK + ldid
        run: |
          export THEOS=~/theos
          echo "THEOS=$THEOS" >> $GITHUB_ENV

          # 安装theos（用于substrate头文件和库）
          git clone --depth 1 --recursive https://github.com/theos/theos.git $THEOS

          # 下载iOS SDK
          git clone --depth 1 --filter=blob:none --sparse https://github.com/xybp888/iOS-SDKs.git /tmp/ios-sdks
          cd /tmp/ios-sdks
          git sparse-checkout set iPhoneOS16.5.sdk || git sparse-checkout set iPhoneOS16.4.sdk
          cd -
          SDK=$(ls -d /tmp/ios-sdks/iPhoneOS*.sdk | head -1)
          echo "SDK=$SDK" >> $GITHUB_ENV
          echo "SDK: $SDK"
          ls "$SDK/usr/lib" | head -10

          # 安装ldid
          brew install ldid

          # 检查编译环境
          echo "=== clang版本 ==="
          xcrun --sdk iphoneos clang --version
          echo "=== substrate头文件 ==="
          ls -la $THEOS/vendor/include/substrate.h 2>&1 || echo "substrate.h not found"
          echo "=== substrate库 ==="
          find $THEOS/vendor -name "*substrate*" -o -name "*Substrate*" 2>/dev/null | head -10
          echo "=== ldid ==="
          ldid --version 2>&1 || true

      - name: Test compile (simple ObjC file)
        run: |
          SDK="${{ env.SDK }}"
          echo "=== 测试简单编译 ==="
          cat > /tmp/test.m << 'EOF'
          #import <Foundation/Foundation.h>
          #import <UIKit/UIKit.h>
          int main() {
              UIView *v = [[UIView alloc] init];
              NSLog(@"test: %@", v);
              return 0;
          }
          EOF
          xcrun --sdk iphoneos clang -arch arm64 -isysroot "$SDK" -miphoneos-version-min=15.0 \
            -fobjc-arc -fno-modules \
            -framework UIKit -framework Foundation \
            -o /tmp/test /tmp/test.m 2>&1
          echo "退出码: $?"
          ls -la /tmp/test 2>&1
          file /tmp/test 2>&1

      - name: Build Tweak.dylib
        run: |
          SDK="${{ env.SDK }}"
          THEOS=~/theos
          echo "=== 编译Tweak ==="

          # 先检查substrate库
          echo "查找substrate库:"
          find $THEOS -name "*.dylib" | xargs -I{} sh -c 'echo "{}: $(file {} | head -1)"' 2>/dev/null | head -20

          # 编译
          xcrun --sdk iphoneos clang -arch arm64 -isysroot "$SDK" -miphoneos-version-min=15.0 \
            -fobjc-arc -fno-modules -Wno-deprecated-declarations \
            -I"$THEOS/vendor/include" \
            -F"$THEOS/vendor/lib" \
            -framework UIKit -framework Foundation -framework QuartzCore -framework CoreGraphics \
            -framework CydiaSubstrate \
            -lc++ \
            -dynamiclib -install_name /usr/lib/AisiMonitor.dylib \
            -o AisiMonitor.dylib Tweak/Tweak.mm 2>&1
          echo "退出码: $?"
          ls -la AisiMonitor.dylib 2>&1
          file AisiMonitor.dylib 2>&1

      - name: Build root helper
        run: |
          SDK="${{ env.SDK }}"
          xcrun --sdk iphoneos clang -arch arm64 -isysroot "$SDK" \
            -o aisi_helper helper/helper.c \
            -framework Foundation -framework IOKit -O2 -Wno-deprecated-declarations
          chmod 6755 aisi_helper
          ls -la aisi_helper
          file aisi_helper

      - name: Build App
        run: |
          SDK="${{ env.SDK }}"
          xcrun --sdk iphoneos clang -arch arm64 -isysroot "$SDK" -miphoneos-version-min=15.0 \
            -fobjc-arc -fno-modules -Wno-deprecated-declarations \
            -IAisiSpy \
            -framework UIKit -framework Foundation -framework CoreGraphics \
            -o AisiSpy_bin \
            AisiSpy/main.m AisiSpy/AppDelegate.m AisiSpy/ViewController.m AisiSpy/LogViewController.m 2>&1
          echo "退出码: $?"
          ls -la AisiSpy_bin 2>&1
          file AisiSpy_bin 2>&1

      - name: Package IPA
        run: |
          rm -rf Payload
          mkdir -p Payload/AisiSpy.app
          cp AisiSpy_bin Payload/AisiSpy.app/AisiSpy
          cp aisi_helper Payload/AisiSpy.app/
          cp AisiMonitor.dylib Payload/AisiSpy.app/
          cp Resources/Info.plist Payload/AisiSpy.app/
          chmod 755 Payload/AisiSpy.app/AisiSpy
          chmod 6755 Payload/AisiSpy.app/aisi_helper
          chmod 755 Payload/AisiSpy.app/AisiMonitor.dylib
          ldid -SResources/entitlements.plist Payload/AisiSpy.app/AisiSpy
          ldid -SResources/entitlements.plist Payload/AisiSpy.app/aisi_helper
          zip -qr AisiSpy.ipa Payload/
          cp AisiSpy.ipa AisiSpy.tipa
          echo "=== 打包完成 ==="
          ls -la AisiSpy.ipa AisiSpy.tipa
          ls -la Payload/AisiSpy.app/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AisiSpy-IPA
          path: |
            AisiSpy.ipa
            AisiSpy.tipa
          retention-days: 30
