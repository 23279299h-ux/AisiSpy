name: Build Reexport Libz Dylib

on:
  push:
    branches: [ main ]
    paths:
      - 'Tweak/minimal.m'
      - '.github/workflows/build-reexport.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SDK + ldid
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/xybp888/iOS-SDKs.git /tmp/ios-sdks
          cd /tmp/ios-sdks
          git sparse-checkout set iPhoneOS16.5.sdk || git sparse-checkout set iPhoneOS16.4.sdk
          cd -
          SDK=$(ls -d /tmp/ios-sdks/iPhoneOS*.sdk | head -1)
          echo "SDK=$SDK" >> $GITHUB_ENV
          echo "SDK: $SDK"
          brew install ldid

      - name: Build reexport libz dylib
        run: |
          SDK="${{ env.SDK }}"

          # 找到libz的完整路径
          LIBZ_PATH=$(find "$SDK" -name "libz.1.dylib" 2>/dev/null | head -1)
          echo "libz路径: $LIBZ_PATH"

          # 编译dylib，重新导出系统libz，同时包含我们的constructor
          xcrun --sdk iphoneos clang -arch arm64 -isysroot "$SDK" -miphoneos-version-min=15.0 \
            -dynamiclib \
            -install_name @executable_path/libz.1.dylib \
            -Xlinker -reexport -Xlinker "$LIBZ_PATH" \
            -o AisiReexportLibz.dylib Tweak/minimal.m 2>&1

          echo "编译完成，退出码: $?"
          ls -la AisiReexportLibz.dylib
          file AisiReexportLibz.dylib

          # 检查导出符号
          echo "=== 导出符号 ==="
          nm -gU AisiReexportLibz.dylib | head -50

          # 签名
          ldid -S AisiReexportLibz.dylib
          echo "签名完成"

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: AisiReexportLibz-dylib
          path: AisiReexportLibz.dylib
          retention-days: 30
