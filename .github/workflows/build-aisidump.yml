name: Build AisiDump rootless deb

on:
  push:
    branches: [main]
    paths: [AisiDump/**]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install tools + SDK
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/xybp888/iOS-SDKs.git /tmp/ios-sdks
          cd /tmp/ios-sdks
          git sparse-checkout set iPhoneOS16.5.sdk || git sparse-checkout set iPhoneOS16.4.sdk
          cd -
          SDK=$(ls -d /tmp/ios-sdks/iPhoneOS*.sdk | head -1)
          echo "SDK=$SDK" >> $GITHUB_ENV
          echo "SDK: $SDK"
          brew install ldid dpkg

      - name: Build AisiDump.dylib
        run: |
          SDK="${{ env.SDK }}"
          cp AisiDump/Tweak.xm AisiDump/Tweak_compiled.c
          xcrun --sdk iphoneos clang -arch arm64 -isysroot "$SDK" -miphoneos-version-min=15.0 \
            -dynamiclib -install_name /var/jb/Library/MobileSubstrate/DynamicLibraries/AisiDump.dylib \
            -o AisiDump.dylib AisiDump/Tweak_compiled.c 2>&1
          ldid -S AisiDump.dylib
          ls -la AisiDump.dylib

      - name: Package DEB
        run: |
          rm -rf pkg
          mkdir -p pkg/DEBIAN
          mkdir -p pkg/var/jb/Library/MobileSubstrate/DynamicLibraries
          cp AisiDump.dylib pkg/var/jb/Library/MobileSubstrate/DynamicLibraries/
          cp AisiDump/AisiDump.plist pkg/var/jb/Library/MobileSubstrate/DynamicLibraries/
          chmod 755 pkg/var/jb/Library/MobileSubstrate/DynamicLibraries/AisiDump.dylib
          chmod 644 pkg/var/jb/Library/MobileSubstrate/DynamicLibraries/AisiDump.plist
          cat > pkg/DEBIAN/control << 'EOF'
          Package: com.aisidump.tweak
          Name: AisiDump
          Version: 1.0.0
          Architecture: iphoneos-arm64
          Description: Memory dump tweak for ESP
          Maintainer: analysis
          Section: Tweaks
          EOF
          chmod 644 pkg/DEBIAN/control
          dpkg-deb --build pkg AisiDump-rootless.deb
          ls -la AisiDump-rootless.deb

      - uses: actions/upload-artifact@v4
        with:
          name: AisiDump-rootless-deb
          path: AisiDump-rootless.deb

      - name: Publish release (anonymous download)
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v5-build.${{ github.run_number }}
          name: AisiDump rootless deb (build ${{ github.run_number }})
          files: AisiDump-rootless.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
