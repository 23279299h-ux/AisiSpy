name: Build MbedTLSHook

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      THEOS: /opt/theos
      THEOS_PACKAGE_SCHEME: rootless

    steps:
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot git perl clang build-essential libxml2-dev zlib1g-dev lzma

      - name: Install Theos
        run: |
          sudo git clone --recursive https://github.com/theos/theos.git /opt/theos
          sudo chown -R $USER:$USER /opt/theos
          curl -sL https://github.com/xybp888/iOS-SDKs/releases/download/iOS-SDKs/iPhoneOS16.5.sdk.tar.xz -o /tmp/sdk.tar.xz
          mkdir -p /opt/theos/sdks
          tar -xf /tmp/sdk.tar.xz -C /opt/theos/sdks/
          ls /opt/theos/sdks/

      - name: Generate tweak source
        run: |
          mkdir -p MbedTLSHook
          echo '' | base64 -d > MbedTLSHook/Tweak.xm
          echo '' | base64 -d > MbedTLSHook/Makefile
          echo '' | base64 -d > MbedTLSHook/control
          echo 'eyBGaWx0ZXIgPSB7IEJ1bmRsZXMgPSAoICJjb20udGVuY2VudC5zbW9iYSIgKTsgfTsgfQo=' | base64 -d > MbedTLSHook/MbedTLSHook.plist
          echo "=== Files generated ==="
          ls -la MbedTLSHook/
          echo "=== Tweak.xm first 5 lines ==="
          head -5 MbedTLSHook/Tweak.xm

      - name: Build
        run: |
          cd MbedTLSHook
          make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless 2>&1
          echo "=== Build result ==="
          ls -la packages/ 2>/dev/null || echo "No packages dir"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: MbedTLSHook-deb
          path: MbedTLSHook/packages/*.deb
          retention-days: 30
