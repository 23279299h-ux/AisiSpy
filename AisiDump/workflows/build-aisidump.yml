name: Build AisiDump rootless deb

on:
  push:
    branches: [main]
    paths: [AisiDump/**]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          export THEOS=/opt/theos
          sudo git clone --recursive https://github.com/theos/theos.git $THEOS
          sudo $THEOS/bin/bootstrap.sh
          sudo $THEOS/bin/install-perl.sh
          echo "THEOS=/opt/theos" >> $GITHUB_ENV

      - name: Setup iOS SDK
        run: |
          sudo mkdir -p /opt/theos/sdks
          cd /opt/theos/sdks
          sudo wget -q https://github.com/theos/sdks/archive/refs/heads/master.tar.gz -O sdk.tar.gz
          sudo tar xf sdk.tar.gz --strip-components=1
          sudo rm sdk.tar.gz
          ls

      - name: Build
        run: |
          cd AisiDump
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: AisiDump-rootless-deb
          path: AisiDump/packages/*.deb
